[package]
name = "yujide-note"
version = "0.2.0"
description = "鱼记得 note · 可同步的桌面便签"
edition = "2021"

[lib]
name = "yujide_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
